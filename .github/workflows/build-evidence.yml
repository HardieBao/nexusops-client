name: NexusOps Client Build Evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - "scripts/*.mjs"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: build-evidence-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-evidence:
    name: Build evidence (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x86_64
            platform: windows
            arch: x86_64
            binary: src-tauri/target/release/nexusops-client.exe
          - os: macos-14
            label: macos-arm64
            platform: macos
            arch: arm64
            binary: src-tauri/target/release/nexusops-client
          - os: ubuntu-22.04
            label: linux-x86_64
            platform: linux
            arch: x86_64
            binary: src-tauri/target/release/nexusops-client

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checked-out source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.3"
          run_install: false

      - name: Verify Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release evidence scripts
        run: node --test scripts/release-scripts.test.mjs

      - name: Headless frontend checks
        run: |
          pnpm typecheck
          pnpm test:unit
          pnpm build:renderer

      - name: Headless Rust checks with Team enabled
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify upstream path with Team disabled
        run: |
          cargo test --locked --no-default-features --manifest-path src-tauri/Cargo.toml
          cargo build --locked --no-default-features --manifest-path src-tauri/Cargo.toml

      - name: Build native release binary without launching GUI
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml

      - name: Record artifact and build evidence
        shell: bash
        env:
          BUILD_BINARY: ${{ matrix.binary }}
          BUILD_LABEL: ${{ matrix.label }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_RUNNER_IMAGE: ${{ matrix.os }}
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
          BUILD_REF: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -f "$BUILD_BINARY"
          mkdir -p build-evidence
          extension=""
          if [ "$RUNNER_OS" = "Windows" ]; then extension=".exe"; fi
          cp "$BUILD_BINARY" "build-evidence/nexusops-client-${BUILD_LABEL}${extension}"
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "runner=$RUNNER_OS"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "source_commit=${{ steps.source.outputs.sha }}"
            echo "source_date=${{ steps.source.outputs.date }}"
            if [ "$RUNNER_OS" = "Linux" ]; then
              uname -a
              for package in \
                libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
                libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev \
                libsoup-3.0-dev libsoup2.4-dev; do
                dpkg-query -W -f='${Package}=${Version}\n' "$package" 2>/dev/null || true
              done
            elif [ "$RUNNER_OS" = "macOS" ]; then
              sw_vers
              xcodebuild -version
              clang --version
            else
              cmd.exe /c ver
              echo "windows_sdk_version=${WindowsSDKVersion:-unknown}"
              echo "vc_tools_version=${VCToolsVersion:-unknown}"
              powershell.exe -NoProfile -Command '
                $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
                if (Test-Path $vswhere) {
                  "visual_studio_version=$(& $vswhere -latest -products * -property installationVersion)"
                }
                $kitsRoot = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" -ErrorAction SilentlyContinue).KitsRoot10
                if ($kitsRoot -and (Test-Path (Join-Path $kitsRoot "Include"))) {
                  "installed_windows_sdks=$((Get-ChildItem (Join-Path $kitsRoot "Include") -Directory | Select-Object -ExpandProperty Name) -join ",")"
                }
              '
            fi
          } > build-evidence/toolchain.txt
          echo "BUILD_PNPM_VERSION=$(pnpm --version)" >> "$GITHUB_ENV"
          echo "BUILD_RUSTC_VERSION=$(rustc --version)" >> "$GITHUB_ENV"
          echo "BUILD_CARGO_VERSION=$(cargo --version)" >> "$GITHUB_ENV"
          echo "BUILD_RUNNER_IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Generate SHA-256 evidence
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_RUNNER_IMAGE: ${{ matrix.os }}
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
          BUILD_REF: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_SOURCE_DATE: ${{ steps.source.outputs.date }}
        run: |
          set -euo pipefail
          node scripts/generate-build-evidence.mjs \
            build-evidence \
            build-evidence/build-evidence.json \
            build-evidence/SHA256SUMS.txt

      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: nexusops-client-build-evidence-${{ matrix.label }}
          path: build-evidence/
          if-no-files-found: error
          retention-days: 14
