name: Release NexusOps Client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Prerelease tag to promote after G3 acceptance (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: macos-14
            arch: universal

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record checked-out source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Validate release identity and version
        shell: bash
        run: |
          node scripts/validate-release.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          node --test scripts/release-scripts.test.mjs

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri signing key
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RAW_SIGNING_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY Secret 为空或不存在" >&2
            echo "请检查 GitHub 仓库 Settings > Secrets and variables > Actions" >&2
            exit 1
          fi

          RAW="$RAW_SIGNING_KEY"
          # 目标：提供正确的私钥“文件路径”给 Tauri CLI，避免内容解码歧义
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          # 情况 1：原始两行文本（第一行以 "untrusted comment:" 开头）
          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
            echo "✅ 使用原始两行密钥文件格式"
          else
            # 情况 2：整体被 base64 包裹（解包后应当是两行）
            if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
               && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$DECODED" > "$KEY_PATH"
              echo "✅ 成功解码 base64 包裹密钥，已还原为两行文件"
            else
              # 情况 3：已是第二行（纯 Base64 一行）→ 构造两行文件
              if echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
                ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
                printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
                echo "✅ 使用一行 Base64 私钥，已构造两行文件"
              else
                echo "❌ TAURI_SIGNING_PRIVATE_KEY 格式无法识别：既不是两行原文，也不是其 base64，亦非一行 base64" >&2
                exit 1
              fi
            fi
          fi
          # 将“完整两行内容”作为环境变量注入（Tauri 支持传入完整私钥文本或文件路径）
          # 使用多行写入语法，保持换行以便解析
          # 将完整两行私钥内容进行 base64 编码，作为单行内容注入环境变量
          if command -v base64 >/dev/null 2>&1; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          elif command -v openssl >/dev/null 2>&1; then
            KEY_B64=$(openssl base64 -A -in "$KEY_PATH")
          else
            KEY_B64=$(KEY_PATH="$KEY_PATH" node -e "process.stdout.write(require('fs').readFileSync(process.env.KEY_PATH).toString('base64'))")
          fi
          if [ -z "$KEY_B64" ]; then
            echo "❌ 无法生成私钥 base64 内容" >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "$RAW_SIGNING_PASSWORD" ]; then
            printf 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=%s\n' "$RAW_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo "✅ Tauri signing key prepared"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TEMP_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Decode .p12 certificate from base64
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE_B64" | (base64 --decode 2>/dev/null || base64 -D) > "$CERT_PATH"

          # Save original default keychain for cleanup
          ORIGINAL_DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d '"' | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$TEMP_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Dynamically resolve signing identity (must be "Developer ID Application")
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "❌ No 'Developer ID Application' identity found — listing all identities:" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "✅ Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Cleanup certificate file
          rm -f "$CERT_PATH"

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== macOS build/notarization attempt ${attempt}/${max_attempts} ==="
            if pnpm tauri build --target universal-apple-darwin; then
              echo "✅ macOS build/notarization succeeded"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ macOS build/notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ macOS build/notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri build
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"  # e.g., v3.5.0

          # A release advertised as universal must come from the universal
          # target. Never fall back to a single-architecture bundle.
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          TAR_GZ=$(find "$BUNDLE_ROOT" -maxdepth 1 -name "*.tar.gz" -type f | head -1 || true)
          APP_PATH=$(find "$BUNDLE_ROOT" -maxdepth 1 -name "*.app" -type d | head -1 || true)

          if [ -z "$TAR_GZ" ]; then
            echo "❌ No macOS .tar.gz updater artifact found" >&2
            exit 1
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ No universal .app found" >&2
            exit 1
          fi

          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")
          case "$APP_EXECUTABLE" in
            ''|*/*) echo "❌ Invalid CFBundleExecutable in universal app" >&2; exit 1 ;;
          esac
          lipo -verify_arch x86_64 arm64 "$APP_PATH/Contents/MacOS/$APP_EXECUTABLE"
          echo "✅ Universal app contains x86_64 and arm64"

          # Staple notarization ticket to .app (Tauri already notarized it)
          xcrun stapler staple "$APP_PATH"
          echo "✅ .app stapled"

          # 1) Collect .tar.gz (updater artifact)
          NEW_TAR_GZ="NexusOps-Client-${VERSION}-macOS.tar.gz"
          cp "$TAR_GZ" "release-assets/$NEW_TAR_GZ"
          if [ ! -f "$TAR_GZ.sig" ]; then
            echo "❌ Required updater signature is missing for $TAR_GZ" >&2
            exit 1
          fi
          cp "$TAR_GZ.sig" "release-assets/$NEW_TAR_GZ.sig"
          echo "macOS updater artifact copied: $NEW_TAR_GZ"

          UPDATER_VERIFY_DIR="$RUNNER_TEMP/nexusops-updater-verify"
          rm -rf "$UPDATER_VERIFY_DIR"
          mkdir -p "$UPDATER_VERIFY_DIR"
          tar -xzf "release-assets/$NEW_TAR_GZ" -C "$UPDATER_VERIFY_DIR"
          UPDATER_APP=$(find "$UPDATER_VERIFY_DIR" -name "*.app" -type d | head -1 || true)
          if [ -z "$UPDATER_APP" ]; then
            echo "❌ Universal updater archive does not contain an .app" >&2
            exit 1
          fi
          UPDATER_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$UPDATER_APP/Contents/Info.plist")
          case "$UPDATER_EXECUTABLE" in
            ''|*/*) echo "❌ Invalid CFBundleExecutable in updater archive" >&2; exit 1 ;;
          esac
          lipo -verify_arch x86_64 arm64 "$UPDATER_APP/Contents/MacOS/$UPDATER_EXECUTABLE"
          rm -rf "$UPDATER_VERIFY_DIR"
          echo "✅ Universal updater archive contains x86_64 and arm64"

          # 2) Collect .app as zip
          NEW_ZIP="NexusOps-Client-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # 3) Create styled DMG with create-dmg (Tauri's built-in DMG styling doesn't work on CI)
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "❌ APPLE_SIGNING_IDENTITY is missing before DMG creation" >&2
            exit 1
          fi

          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="NexusOps-Client-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/NexusOps Client.app"

          create-dmg \
            --volname "NexusOps Client" \
            --background "src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "NexusOps Client.app" 180 220 \
            --hide-extension "NexusOps Client.app" \
            --app-drop-link 480 220 \
            --codesign "$APPLE_SIGNING_IDENTITY" \
            --no-internet-enable \
            "release-assets/$NEW_DMG" \
            "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Styled DMG created: $NEW_DMG"

      - name: Notarize macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -z "$DMG_PATH" ]; then
            echo "❌ No .dmg found in release-assets/ to notarize" >&2
            exit 1
          fi

          echo "=== Notarizing DMG: $DMG_PATH ==="
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== DMG notarization attempt ${attempt}/${max_attempts} ==="
            if xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait; then
              echo "✅ DMG notarization succeeded"
              xcrun stapler staple "$DMG_PATH"
              echo "✅ DMG stapled"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ DMG notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ DMG notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Verify macOS code signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          # Verify the universal bundle itself; a single-architecture fallback
          # must never be published under the universal filename.
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP_PATH=$(find "$BUNDLE_ROOT" -maxdepth 1 -name "*.app" -type d | head -1 || true)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No universal .app found for verification" >&2
            exit 1
          fi
          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")
          case "$APP_EXECUTABLE" in
            ''|*/*) echo "❌ Invalid CFBundleExecutable in universal app" >&2; exit 1 ;;
          esac
          lipo -verify_arch x86_64 arm64 "$APP_PATH/Contents/MacOS/$APP_EXECUTABLE"
          echo "=== Verifying .app: $APP_PATH ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✅ codesign verification passed"
          spctl -a -t exec -vv "$APP_PATH"
          echo "✅ spctl assessment passed"
          xcrun stapler validate "$APP_PATH"
          echo "✅ .app stapler validation passed"

          # Verify .dmg (from release-assets/, created by create-dmg + notarized)
          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -n "$DMG_PATH" ]; then
            echo "=== Verifying .dmg: $DMG_PATH ==="
            codesign --verify --verbose=2 "$DMG_PATH"
            echo "✅ .dmg codesign verification passed"
            spctl -a -t open --context context:primary-signature -vv "$DMG_PATH"
            echo "✅ .dmg spctl assessment passed"
            xcrun stapler validate "$DMG_PATH"
            echo "✅ .dmg stapler validation passed"
          else
            echo "❌ No .dmg found for verification — release would ship without verified DMG" >&2
            exit 1
          fi

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:GITHUB_REF_NAME  # e.g., v3.5.0
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          # 仅打包 MSI 安装器 + .sig（用于 Updater）
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "NexusOps-Client-$VERSION-Windows$assetSuffix.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
            $sigPath = "$($msi.FullName).sig"
            if (Test-Path $sigPath) {
              Copy-Item $sigPath (Join-Path release-assets ("$dest.sig"))
              Write-Host "Signature copied: $dest.sig"
            } else {
              throw "Required updater signature not found for $($msi.Name)"
            }
          } else {
            throw "No Windows $env:WINDOWS_RELEASE_ARCH MSI installer found"
          }

          # 绿色版（portable）：仅可执行文件打 zip（不参与 Updater）
          $exeCandidates = if ($isArm64) {
            @('src-tauri/target/aarch64-pc-windows-msvc/release/nexusops-client.exe')
          } else {
            @(
              'src-tauri/target/release/nexusops-client.exe',
              'src-tauri/target/x86_64-pc-windows-msvc/release/nexusops-client.exe'
            )
          }
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/NexusOps-Client-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath (Join-Path $portableDir 'nexusops-client.exe')
            Copy-Item 'LICENSE' (Join-Path $portableDir 'LICENSE.txt')
            Copy-Item 'UPSTREAM_NOTICE.md' $portableDir
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = if ($isArm64) {
              @(
                '# NexusOps Client portable ARM64 build marker',
                'portable=true',
                'arch=arm64'
              )
            } else {
              @(
                '# NexusOps Client portable build marker',
                'portable=true'
              )
            }
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/NexusOps-Client-$VERSION-Windows$assetSuffix-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Windows portable zip created: NexusOps-Client-$VERSION-Windows$assetSuffix-Portable.zip"
          } else {
            throw "Portable Windows $env:WINDOWS_RELEASE_ARCH executable not found"
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"  # e.g., v3.5.0
          ARCH="${{ matrix.arch }}"
          # Updater artifact: AppImage（含对应 .sig）
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -n "$APPIMAGE" ]; then
            NEW_APPIMAGE="NexusOps-Client-${VERSION}-Linux-${ARCH}.AppImage"
            cp "$APPIMAGE" "release-assets/$NEW_APPIMAGE"
            if [ ! -f "$APPIMAGE.sig" ]; then
              echo "Required updater signature is missing for $APPIMAGE" >&2
              exit 1
            fi
            cp "$APPIMAGE.sig" "release-assets/$NEW_APPIMAGE.sig"
            echo "AppImage copied: $NEW_APPIMAGE"
          else
            echo "No AppImage found under target/release/bundle" >&2
            exit 1
          fi
          # 额外上传 .deb（用于手动安装，不参与 Updater）
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-assets/NexusOps-Client-${VERSION}-Linux-${ARCH}.deb"
            echo "Deb package copied: NexusOps-Client-${VERSION}-Linux-${ARCH}.deb"
          else
            echo "Required .deb package is missing" >&2
            exit 1
          fi
          # 额外上传 .rpm（用于 Fedora/RHEL/openSUSE 等，不参与 Updater）
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-assets/NexusOps-Client-${VERSION}-Linux-${ARCH}.rpm"
            echo "RPM package copied: NexusOps-Client-${VERSION}-Linux-${ARCH}.rpm"
          else
            echo "Required .rpm package is missing" >&2
            exit 1
          fi

      - name: Record release artifact hashes and provenance
        shell: bash
        env:
          BUILD_PLATFORM: ${{ runner.os }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_RUNNER_IMAGE: ${{ matrix.os }}
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          evidence_id="NexusOps-Client-${GITHUB_REF_NAME}-${RUNNER_OS}-${{ matrix.arch }}"
          export BUILD_PNPM_VERSION="$(pnpm --version)"
          export BUILD_RUSTC_VERSION="$(rustc --version)"
          export BUILD_CARGO_VERSION="$(cargo --version)"
          export BUILD_RUNNER_IMAGE_VERSION="${ImageVersion:-unknown}"
          export BUILD_SOURCE_DATE="${{ steps.source.outputs.date }}"
          toolchain_path="release-assets/${evidence_id}-toolchain.txt"
          {
            echo "node=$(node --version)"
            echo "pnpm=$BUILD_PNPM_VERSION"
            echo "rustc=$BUILD_RUSTC_VERSION"
            echo "cargo=$BUILD_CARGO_VERSION"
            echo "runner=$RUNNER_OS"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "source_commit=$BUILD_COMMIT"
            echo "source_date=$BUILD_SOURCE_DATE"
            if [ "$RUNNER_OS" = "Linux" ]; then
              uname -a
              for package in \
                libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
                libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev \
                libsoup-3.0-dev libsoup2.4-dev; do
                dpkg-query -W -f='${Package}=${Version}\n' "$package" 2>/dev/null || true
              done
            elif [ "$RUNNER_OS" = "macOS" ]; then
              sw_vers
              xcodebuild -version
              clang --version
            else
              cmd.exe /c ver
              echo "windows_sdk_version=${WindowsSDKVersion:-unknown}"
              echo "vc_tools_version=${VCToolsVersion:-unknown}"
              powershell.exe -NoProfile -Command '
                $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
                if (Test-Path $vswhere) {
                  "visual_studio_version=$(& $vswhere -latest -products * -property installationVersion)"
                }
                $kitsRoot = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" -ErrorAction SilentlyContinue).KitsRoot10
                if ($kitsRoot -and (Test-Path (Join-Path $kitsRoot "Include"))) {
                  "installed_windows_sdks=$((Get-ChildItem (Join-Path $kitsRoot "Include") -Directory | Select-Object -ExpandProperty Name) -join ",")"
                }
              '
            fi
          } > "$toolchain_path"
          node scripts/generate-build-evidence.mjs \
            release-assets \
            "release-assets/${evidence_id}-build-evidence.json" \
            "release-assets/${evidence_id}-SHA256SUMS.txt"

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Collect Signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "Collected signatures (if any alongside artifacts):"
          ls -la release-assets/*.sig || echo "No signatures found"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

      - name: Clean up Apple signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    needs: release
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release notices
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Add license and upstream notice
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE release-assets/NexusOps-Client-LICENSE.txt
          cp UPSTREAM_NOTICE.md release-assets/NexusOps-Client-UPSTREAM-NOTICE.md

      - name: Verify signed updater payloads and release asset set
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$COMMIT")"
          node scripts/generate-updater-manifest.mjs \
            release-assets "$TAG" "$REPO" "$COMMIT" release-assets/latest.json
          node scripts/generate-download-manifest.mjs \
            release-assets "$TAG" "https://github.com/$REPO/releases/download" \
            "$COMMIT" "$RUNNER_TEMP/download-manifest.json" "$(git show -s --format=%cI "$COMMIT")"

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: NexusOps Client ${{ github.ref_name }}
          prerelease: true
          body: |
            ## NexusOps Client ${{ github.ref_name }}

            NexusOps 的团队 AI 接入与受管资产桌面客户端。

            本项目基于 [CC Switch](https://github.com/farion1231/cc-switch) 的 MIT 许可代码开发。上游项目及其网站不负责 NexusOps Client 的发布、签名或支持。

            ### 制品与验收边界

            以下文件先以预发布候选形式产出。正式支持范围必须以同一版本的安装、启动、协议导入、Team 同步、退出和卸载 G3 验收记录为准；仅有构建成功不代表安装或 GUI 验收通过。

            - **macOS 12+ (Universal)**: `NexusOps-Client-${{ github.ref_name }}-macOS.dmg` 或 `.zip`
            - **Windows 10+ (x86_64)**: `NexusOps-Client-${{ github.ref_name }}-Windows.msi` 或 `-Portable.zip`
            - **Windows 11 (ARM64)**: `NexusOps-Client-${{ github.ref_name }}-Windows-arm64.msi` 或 `-Portable.zip`
            - **Linux (x86_64 / ARM64)**: `NexusOps-Client-${{ github.ref_name }}-Linux-<arch>.AppImage` / `.deb` / `.rpm`

            > `.tar.gz` 为 Tauri updater 自动更新专用，无需手动下载。

            ---
            本工作流发布的 macOS 制品已经 Apple Developer ID 签名和公证。Windows 制品的操作系统代码签名状态以随版本发布的验收记录为准；Tauri updater 签名不等同于 Windows Authenticode 签名。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-release:
    name: Promote G3-accepted prerelease
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    environment: release-promotion
    permissions:
      contents: write
    steps:
      - name: Require protected promotion gate
        env:
          PROMOTION_ENABLED: ${{ vars.NEXUSOPS_G3_PROMOTION_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$PROMOTION_ENABLED" != "true" ]; then
            echo "::error::The release-promotion environment must set NEXUSOPS_G3_PROMOTION_ENABLED=true after required reviewers are configured."
            exit 1
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Validate prerelease and evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node scripts/validate-release.mjs "$TAG" "$GITHUB_REPOSITORY"
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::$TAG must be a published prerelease, not a draft."
            exit 1
          fi
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
            echo "::error::$TAG is not a prerelease awaiting promotion."
            exit 1
          fi
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets --repo "$GITHUB_REPOSITORY"
          COMMIT="$(git rev-parse HEAD)"
          test -f release-assets/G3-EVIDENCE.json
          node scripts/generate-build-evidence.mjs \
            --validate-g3 release-assets/G3-EVIDENCE.json "$TAG" "$COMMIT" release-assets
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$COMMIT")"
          node scripts/generate-updater-manifest.mjs \
            release-assets "$TAG" "$GITHUB_REPOSITORY" "$COMMIT" "$RUNNER_TEMP/latest.json"
          cmp "$RUNNER_TEMP/latest.json" release-assets/latest.json
          node scripts/generate-download-manifest.mjs \
            release-assets "$TAG" "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            "$COMMIT" "$RUNNER_TEMP/download-manifest.json" "$(git show -s --format=%cI "$COMMIT")"

      - name: Promote accepted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

  sync-r2-after-promotion:
    name: Sync promoted release to R2
    if: github.event_name == 'workflow_dispatch'
    needs: promote-release
    uses: ./.github/workflows/sync-r2.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
