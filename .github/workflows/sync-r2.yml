# Optionally mirror NexusOps Client release assets and manifests to a
# NexusOps-owned Cloudflare R2 bucket. The desktop updater continues to use
# GitHub Releases unless its reviewed Tauri configuration is changed later.
#
# Triggered on release promotion (`released` fires when a prerelease is
# flipped to a full release, or a release is published as stable directly) —
# NOT on tag push. This keeps the R2 root manifests behind the same gate as
# GitHub's /releases/latest/: while a release sits as prerelease, neither the
# download page nor the updater sees it. Additionally, a run only touches the
# root manifests (and prunes old versions) when its tag IS releases/latest —
# manual backfills of older tags restore versioned files only.
# A latest release must also carry G3-EVIDENCE.json; its payload hashes and
# updater signatures are revalidated from the tagged source before mirroring.
#
# An entirely absent R2 configuration is an intentional no-op. A partial
# configuration fails so a maintainer cannot mistake an incomplete mirror for
# a valid one.
#
# Optional repository variables: NEXUSOPS_R2_BUCKET,
# NEXUSOPS_R2_PUBLIC_BASE_URL. Optional secrets: NEXUSOPS_R2_ACCOUNT_ID,
# NEXUSOPS_R2_ACCESS_KEY_ID, NEXUSOPS_R2_SECRET_ACCESS_KEY.
name: Sync NexusOps release to R2

on:
  release:
    types: [released]
  # Manual recovery/backfill: re-sync any existing release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v3.18.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Stable release tag promoted by the release workflow"
        required: true
        type: string

permissions:
  contents: read

# latest.json / manifest.json are last-writer-wins. Serialize runs and let the
# current run finish; GitHub may still replace an older pending run with a newer
# one, and the latest-release check below keeps that replacement safe.
concurrency:
  group: sync-r2
  cancel-in-progress: false

jobs:
  sync-to-r2:
    name: Sync NexusOps release to R2
    runs-on: ubuntu-22.04
    env:
      R2_BUCKET: ${{ vars.NEXUSOPS_R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.NEXUSOPS_R2_PUBLIC_BASE_URL }}
      KEEP_VERSIONS: "5"
      AWS_ACCESS_KEY_ID: ${{ secrets.NEXUSOPS_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NEXUSOPS_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # aws-cli >= 2.23 defaults to CRC checksums that R2 rejects.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.NEXUSOPS_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check R2 secrets
        id: r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.NEXUSOPS_R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::No release tag to sync."
            exit 1
          fi
          configured=0
          for value in "$R2_ACCOUNT_ID" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$R2_BUCKET" "$R2_PUBLIC_BASE_URL"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 5 ]; then
            case "$R2_PUBLIC_BASE_URL" in
              https://*) ;;
              *) echo "::error::NEXUSOPS_R2_PUBLIC_BASE_URL must use HTTPS."; exit 1;;
            esac
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "NexusOps R2 mirror is configured."
          elif [ "$configured" -eq 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "NexusOps R2 is not configured; GitHub Releases remains the updater and download source."
          else
            echo "::error::NexusOps R2 configuration is partial; set all five NEXUSOPS_R2 values or remove all of them."
            exit 1
          fi

      # Only the tag that IS GitHub's releases/latest may touch the bucket-root
      # manifests or prune old versions. This keeps manual backfills of old
      # tags harmless (they only restore versioned files — otherwise the root
      # manifests would point at a version the prune step deletes right after)
      # and makes out-of-order runs self-correcting: whichever run executes,
      # only the true latest publishes the manifests.
      - name: Check whether tag is the latest stable release
        id: latest
        if: steps.r2.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # An API failure must fail the run — mapping it to "not latest"
          # would skip the root manifests on a green run, silently leaving
          # them stale (the exact failure mode this workflow exists to make
          # loud). Retry transient errors, then give up loudly.
          latest=""
          for attempt in 1 2 3 4; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)
            if [ -n "$latest" ]; then
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 10))
            fi
          done
          if [ -z "$latest" ]; then
            echo "::error::Could not resolve the latest stable release from GitHub after 4 attempts; failing instead of guessing."
            exit 1
          fi
          if [ "$TAG" = "$latest" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is the latest stable release; full sync."
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is not the latest stable release ($latest); syncing versioned files only — root manifests and pruning are skipped."
          fi

      - name: Checkout tagged release source
        if: steps.r2.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 1

      - name: Download release assets
        if: steps.r2.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p r2-assets
          gh release download "$TAG" --dir r2-assets --repo "$GITHUB_REPOSITORY"
          ls -la r2-assets

      - name: Validate release assets and build provenance
        if: steps.r2.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          node scripts/generate-build-evidence.mjs \
            --validate-g3 r2-assets/G3-EVIDENCE.json "$TAG" "$commit" r2-assets
          pub_date=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$commit")"
          node scripts/generate-updater-manifest.mjs \
            r2-assets "$TAG" "$GITHUB_REPOSITORY" "$commit" "$RUNNER_TEMP/latest.json"
          cmp "$RUNNER_TEMP/latest.json" r2-assets/latest.json
          node scripts/generate-download-manifest.mjs \
            r2-assets "$TAG" "$R2_PUBLIC_BASE_URL" "$commit" manifest.json "$pub_date"

      - name: Rewrite updater manifest for R2
        if: steps.r2.outputs.configured == 'true' && steps.latest.outputs.is_latest == 'true'
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          node scripts/rewrite-updater-manifest.mjs \
            r2-assets/latest.json "$TAG" "$R2_PUBLIC_BASE_URL" "$commit" latest-r2.json

      - name: Upload versioned assets to R2
        if: steps.r2.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # Versioned paths are immutable. The helper verifies all existing
          # bytes before creating any missing object and uses If-None-Match for
          # each put, then downloads every new object for a hash check.
          node scripts/sync-r2-versioned.mjs \
            r2-assets "$R2_BUCKET" "$TAG" "$R2_ENDPOINT"

      - name: Publish root manifests to R2
        if: steps.r2.outputs.configured == 'true' && steps.latest.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Re-verify right before touching the root manifests: a newer
          # release may have been promoted while assets were downloading.
          # Skipping then is safe — the newer release's own queued run
          # publishes the newer manifests. An unresolvable API is still a
          # hard failure, never a guess.
          latest=""
          for attempt in 1 2 3 4; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)
            if [ -n "$latest" ]; then
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 10))
            fi
          done
          if [ -z "$latest" ]; then
            echo "::error::Could not re-verify the latest stable release before publishing root manifests; failing instead of guessing."
            exit 1
          fi
          if [ "$TAG" != "$latest" ]; then
            echo "::warning::$TAG stopped being the latest stable release mid-run ($latest is); leaving root manifests untouched."
            exit 0
          fi
          # Both manifests are replaced on every release — keep edge cache
          # short. Uploaded after the assets they reference so an aborted run
          # never leaves them pointing at missing files.
          aws s3 cp manifest.json "s3://$R2_BUCKET/manifest.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=300" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp latest-r2.json "s3://$R2_BUCKET/latest.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=300" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Prune old versions
        if: steps.r2.outputs.configured == 'true' && steps.latest.outputs.is_latest == 'true'
        run: |
          set -euo pipefail
          versions=$(aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT" \
            | awk '$1 == "PRE" {print $2}' | tr -d '/' | grep -E '^v[0-9]' || true)
          count=$(printf '%s\n' "$versions" | grep -c . || true)
          if [ "$count" -le "$KEEP_VERSIONS" ]; then
            echo "Nothing to prune ($count versions, keeping up to $KEEP_VERSIONS)."
            exit 0
          fi
          prune_list=$(printf '%s\n' "$versions" \
            | node scripts/rewrite-updater-manifest.mjs --prune-list "$TAG" "$KEEP_VERSIONS")
          printf '%s\n' "$prune_list" | while IFS= read -r old; do
            [ -n "$old" ] || continue
            echo "Pruning s3://$R2_BUCKET/$old/"
            aws s3 rm "s3://$R2_BUCKET/$old/" --recursive --endpoint-url "$R2_ENDPOINT"
          done
