<style>
:root{color-scheme:dark;--bg:#101116;--side:#14151d;--surface:#181a23;--line:#303340;--text:#eeeff5;--muted:#a4a8ba;--accent:#b99aff;--green:#69d6a8;--amber:#f4c578;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{color:inherit}button:disabled{opacity:.5;cursor:not-allowed}.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}aside{background:var(--side);border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:0 10px;font-weight:650;font-size:18px}.brand img{width:32px;height:32px}.org{border:1px solid var(--line);border-radius:10px;padding:12px;background:transparent;text-align:left;line-height:1.7}.org small{display:block;color:var(--muted)}nav{display:grid;gap:5px}.nav{border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;text-align:left}.nav:hover{background:#20232e;color:var(--text)}.nav[aria-current=page]{background:#302840;color:#e0d1ff}.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;flex-shrink:0}.secondary{margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}.local{font-size:12px;color:var(--muted);padding:0 12px;line-height:1.7}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}.main{min-width:0;padding:0 32px 36px}.topbar{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}.topbar span{color:var(--muted);font-size:12px}.topbar a{color:var(--accent);text-decoration:none;font-size:13px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:30px 0 25px}h1{font-size:28px;margin:0 0 10px;letter-spacing:-.02em;font-weight:650}p{color:var(--muted);line-height:1.7;margin:0;max-width:75ch}h2{font-size:16px;margin:0;font-weight:600}h3{font-size:14px;margin:0 0 8px;font-weight:600}.primary,.button,.textbtn{border:1px solid var(--line);border-radius:8px;background:#232633;padding:9px 14px;white-space:nowrap}.primary{background:#c3a8ff;color:#20172f;border-color:transparent;font-weight:650}.primary:hover{background:#d6bfff}.button:hover{background:#303445}.textbtn{border:0;background:transparent;color:var(--accent);padding:8px 0}.statusbar{display:flex;flex-wrap:wrap;gap:24px;padding:15px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px;color:var(--muted);font-size:13px}.statusbar strong{color:var(--text);font-weight:500;margin-left:7px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:26px}.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}.panelhead{padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.panelhead p{font-size:12px;margin-top:6px}.rows{padding:0 20px}.tool{display:grid;grid-template-columns:40px minmax(0,1fr) 120px;gap:14px;padding:20px 0;border-top:1px solid var(--line);align-items:center}.toolmark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #45495a;border-radius:9px;font-weight:600;color:#d9dbea}.tool small,.sub{display:block;color:var(--muted);font-size:12px;margin-top:7px;line-height:1.6}.state{text-align:right;font-size:12px;color:var(--green)}.state.warn{color:var(--amber)}.state .textbtn{display:block;text-align:right;width:100%;font-size:12px}.asidepanel{border-left:1px solid var(--line);padding-left:24px}.issue{padding:20px 0;border-bottom:1px solid var(--line)}.issue p{font-size:13px}.issue .textbtn{font-size:13px;margin-top:5px}.bottom{margin-top:26px}.asset{display:grid;grid-template-columns:minmax(0,1fr) 100px 120px;gap:15px;align-items:center;border-top:1px solid var(--line);padding:17px 20px}.tag{display:inline-flex;align-items:center;font-size:11px;border:1px solid #44495c;border-radius:5px;padding:3px 7px;margin-right:9px;color:#c7cada}.pill{color:var(--green);font-size:12px}.warning{color:var(--amber)}.sectionnote{padding:15px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}.filters select{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:22px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:0 0 13px;color:var(--muted)}.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}.detail{padding:20px;border-top:1px solid var(--line)}.detail p{font-size:13px;margin-bottom:10px}.measure{display:flex;gap:40px;flex-wrap:wrap;border-top:1px solid var(--line);padding:22px 20px}.measure span{color:var(--muted);font-size:12px}.measure strong{display:block;font-size:25px;color:var(--text);font-weight:600;margin-top:9px;font-variant-numeric:tabular-nums}.chart{padding:16px 22px 24px}.chart svg{width:100%;height:190px}.chartlabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.barrow{margin:25px 0}.barrow>div{display:flex;justify-content:space-between;font-size:13px}.track{height:5px;background:#2e3140;margin-top:12px;border-radius:5px;overflow:hidden}.track span{display:block;height:100%;background:var(--accent)}details{padding:16px 20px;border-top:1px solid var(--line)}summary{cursor:pointer;color:#d6d9e5;font-size:13px}details p{margin-top:15px;font-size:13px}details .button{margin:15px 8px 0 0}.empty{padding:44px 24px;text-align:center}.empty p{margin:12px auto 22px}.feedback{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:min(660px,90vw);padding:15px 20px;background:#2e293f;color:#f3efff;border:1px solid #796297;border-radius:10px;line-height:1.6;z-index:5}.feedback.show{display:block}.settingsrow{padding:20px;display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line)}.settingsrow p{font-size:12px;margin-top:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media(min-width:1500px){.main{padding-left:44px;padding-right:44px}.grid{grid-template-columns:minmax(0,1fr) 310px}}@media(max-width:1050px){.shell{grid-template-columns:184px 1fr}.main{padding:0 24px 28px}.grid{grid-template-columns:1fr}.asidepanel{border:1px solid var(--line);border-radius:12px;padding:20px;order:-1}.asidepanel .issue{padding-bottom:0;border-bottom:0}.asidepanel .issue+.issue{border-top:1px solid var(--line);margin-top:18px}.two{grid-template-columns:1fr}}@media(max-width:680px){.shell{display:block}aside{position:relative;height:auto;padding:16px;gap:12px;border-right:0;border-bottom:1px solid var(--line)}aside .org,aside .local,aside .secondary{display:none}nav{display:flex;flex-wrap:wrap}.nav{padding:10px;font-size:12px;gap:6px}.brand{padding:0;margin-bottom:4px}.main{padding:0 18px 28px}.topbar{min-height:55px}.topbar a{font-size:12px}.heading{margin-top:24px;flex-direction:column}h1{font-size:25px}.statusbar{gap:14px}.tool{grid-template-columns:32px minmax(0,1fr) 96px;gap:10px}.toolmark{width:30px;height:30px}.asset{grid-template-columns:minmax(0,1fr) 90px}.asset>.version{display:none}.measure{gap:25px}.settingsrow{flex-wrap:wrap}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol><symbol id="tool" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></symbol><symbol id="box" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5zm-9 5v10l9 4 9-4V8M12 13v9"/></symbol><symbol id="chart" viewBox="0 0 24 24"><path d="M4 3v17h17M8 16v-5m5 5V6m5 10V9"/></symbol><symbol id="team" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m1 4a5 5 0 0 1 4 5"/></symbol><symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></symbol></defs></svg>
<div class="shell">
<aside><div class="brand"><img src="preview-logo.png" alt="">NexusOps</div><button class="org" data-nav="organization">产品研发工作区<small><span class="dot"></span>团队连接正常 · 示例状态</small></button><nav aria-label="主导航"><button class="nav" data-nav="home" aria-current="page"><svg><use href="#grid"/></svg>工作台</button><button class="nav" data-nav="tools"><svg><use href="#tool"/></svg>工具接入</button><button class="nav" data-nav="assets"><svg><use href="#box"/></svg>资产库</button><button class="nav" data-nav="usage"><svg><use href="#chart"/></svg>使用记录</button></nav><nav class="secondary" aria-label="工作区设置"><button class="nav" data-nav="organization"><svg><use href="#team"/></svg>组织与上报</button><button class="nav" data-nav="settings"><svg><use href="#settings"/></svg>设置</button></nav><div class="local">本机配置由你控制<br>团队统计只上报必要元数据</div></aside>
<div class="main"><div class="topbar"><span>交互设计稿 · 所有数据均为示例</span><a href="2026-09-10-client-redesign.md">查看重构方案</a></div><main id="content"></main></div>
</div><div class="feedback" role="status" aria-live="polite"></div>
<script>
const heading=(title,description,action='配置工具',target='tools')=>`<div class="heading"><div><h1>${title}</h1><p>${description}</p></div><button class="primary" data-nav="${target}">${action}</button></div>`;
const toolRows=()=>`<div class="rows"><div class="tool" data-runtime="codex"><div class="toolmark">Cx</div><div><h3>Codex</h3><small>团队配置 · NexusOps Gateway</small><small>连接已检测 · 已观察到 Hook 事件</small></div><div class="state">可以使用<button class="textbtn" data-note="正式版将展示当前配置、授权模型和检测记录，再决定是否切换。">查看配置</button></div></div><div class="tool" data-runtime="claude"><div class="toolmark">Cl</div><div><h3>Claude Code</h3><small>团队配置 · NexusOps Gateway</small><small>连接已检测 · Hook 等待工具确认</small></div><div class="state warn">采集待确认<button class="textbtn" data-note="重启 Claude Code，在 /hooks 中确认新增定义。配置已安装不能代替真实事件确认。">查看步骤</button></div></div><div class="tool" data-runtime="gemini"><div class="toolmark">Gm</div><div><h3>Gemini CLI</h3><small>个人配置 · 保留现有设置</small><small>尚未检测 · 首版不支持 Hook 统计</small></div><div class="state" style="color:var(--muted)">未检测<button class="textbtn" data-note="连接检测须由用户主动触发；未检测前不显示绿色可用状态。">检测连接</button></div></div></div>`;
const assetRows=()=>`<div class="asset"><div><span class="tag">RULE</span>团队代码规范<span class="sub">团队发布 · Codex / Claude Code</span></div><span class="version sub">v2 → v3</span><button class="textbtn" data-note="展示 v2 与 v3 的只读差异，确认后再同步；不会静默覆盖本地修改。">查看更新</button></div><div class="asset"><div><span class="tag">SKILL</span>前端代码检查<span class="sub">团队发布 · Codex</span></div><span class="version sub">v1.4</span><span class="pill">已同步</span></div><div class="asset"><div><span class="tag">PROMPT</span>变更说明模板<span class="sub">团队发布 · 本机存在编辑</span></div><span class="version sub">v2</span><button class="textbtn warning" data-note="正式版提供保留本地、查看差异和明确覆盖；覆盖前创建备份，并提供恢复入口。">处理冲突</button></div>`;
const views={
home:()=>heading('工作台','先确认工具可用，再处理团队配置与资产变更。')+`<div class="statusbar"><span>组织连接<strong><span class="dot"></span>正常</strong></span><span>可用工具<strong>2 / 3</strong></span><span>上次资产同步<strong>今天 09:42</strong></span></div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>我的工具</h2><p>连接与采集状态分开显示</p></div><button class="textbtn" data-nav="tools">管理接入</button></div>${toolRows()}</section><section class="asidepanel"><h2>需要处理</h2><div class="issue"><h3>1 项团队资产有本地修改</h3><p>先查看差异，再决定保留本地内容还是更新。</p><button class="textbtn" data-nav="assets">查看资产冲突</button></div><div class="issue"><h3>Claude Code 采集待确认</h3><p>工具已经配置完成，仍需在工具内确认 Hook。</p><button class="textbtn" data-nav="organization">检查采集状态</button></div></section></div><section class="panel bottom"><div class="panelhead"><div><h2>团队资产</h2><p>1 项更新 · 1 项冲突 · 同步前可预览变更</p></div><button class="textbtn" data-nav="assets">打开资产库</button></div>${assetRows()}</section>`,
tools:()=>heading('工具接入','团队配置和个人配置都有明确来源；导入与启用分开操作。','连接新工具','organization')+`<section class="panel"><div class="panelhead"><h2>已配置工具</h2><span class="sub">工具能力不同，状态分别检测</span></div>${toolRows()}<details><summary>高级配置：供应商、代理、MCP 与运行时扩展</summary><p>保留现有供应商、通用配置、代理接管、MCP、OpenClaw / Hermes 功能。按选中的工具展示支持的操作，不让首页承载所有配置。</p><button class="button" data-note="正式版复用现有 ProviderList 与配置编辑器，并保留预览和确认。">供应商配置</button><button class="button" data-note="正式版复用现有 UnifiedMcpPanel，不迁移或删除已有服务器配置。">MCP 配置</button></details></section>`,
assets:()=>heading('资产库','先看资产从哪里来、在哪个工具生效，再决定是否同步。','检查更新','assets')+`<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-source="team">团队发布</button><button role="tab" aria-selected="false" data-source="local">个人本地</button></div><div id="asset-body"><section class="panel"><div class="panelhead"><h2>当前授权的 Stable 资产</h2><button class="button" data-note="先生成同步计划，列出新增、更新和冲突；确认后才写入本地文件。">预览同步计划</button></div>${assetRows()}<div class="sectionnote">团队资产保留版本和来源；已下载文件与服务端授权分别展示，撤回不会被误报为本机已删除。</div></section></div>`,
usage:()=>heading('使用记录','本机模型请求与组织上报使用不同口径，分别查看。','查看上报状态','organization')+`<div class="filters"><label><select aria-label="统计时间"><option>最近 7 天</option><option>今天</option><option>最近 30 天</option></select></label><label><select aria-label="统计工具"><option>全部工具</option><option>Codex</option><option>Claude Code</option></select></label></div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>本机模型请求</h2><p>示例：从本机日志与代理数据聚合</p></div><span class="tag">示例数据</span></div><div class="measure"><span>模型请求<strong>246</strong></span><span>Token<strong>1.82M</strong></span><span>本地估算费用<strong>$12.40</strong></span></div><div class="chart"><svg viewBox="0 0 600 180" role="img" aria-label="示例请求趋势，非真实统计"><path d="M0 25H600M0 80H600M0 135H600" stroke="#303340"/><polyline points="0,143 100,99 200,112 300,36 400,67 500,80 600,55" fill="none" stroke="#ba9cff" stroke-width="2.5"/></svg><div class="chartlabels"><span>9月4日</span><span>9月5日</span><span>9月6日</span><span>9月7日</span><span>9月8日</span><span>9月9日</span><span>9月10日</span></div></div><div class="sectionnote">估算费用不等于组织网关账单。正式版直接复用现有 UsageDashboard 数据源；筛选会重新查询对应范围。</div></section><section class="asidepanel"><h2>工具分布</h2><div class="barrow"><div><span>Codex</span><span>164 次</span></div><div class="track"><span style="width:67%"></span></div></div><div class="barrow"><div><span>Claude Code</span><span>82 次</span></div><div class="track"><span style="width:33%"></span></div></div><p style="font-size:12px">这里统计模型请求，不把 Hook 事件数相加，也不推断 Skill 成功率。</p></section></div>`,
organization:()=>heading('组织与上报','连接身份、数据边界和故障恢复集中管理。','返回工作台','home')+`<div class="two"><section class="panel"><div class="panelhead"><h2>当前组织</h2></div><div class="detail"><h3>产品研发工作区</h3><p>示例员工 · Key 尾号 7c21<br>组织身份由服务端确认，不能替其他员工上报。</p><button class="button" data-note="正式版导入 Profile 后先显示组织与成员身份，确认后连接，不自动替换个人配置。">导入团队配置</button></div><details><summary>连接详情与退出组织</summary><p>域名、组织 ID、工作区 ID 和凭据元信息放在详情中；永不显示完整 Key。退出时停止采集并清理待上传队列，保留本机资产与必要的恢复记录。</p><button class="button" data-note="这是线框，未执行退出。正式版须清晰说明凭据清理与本地文件保留范围。">退出组织</button></details></section><section class="panel"><div class="panelhead"><h2>组织使用统计</h2><span class="pill">示例：已启用</span></div><div class="detail"><p>管理员可看到你使用的工具、次数和时间。不会上传提示词、代码、对话、目录路径或原始会话 ID。</p><div class="statusbar"><span>待上传<strong>4 条</strong></span><span>最近成功<strong>09:48</strong></span></div><button class="button" data-note="正式版使用 team_upload_tool_usage；失败保留原始去重 ID，重试不会重复计数。">立即上传</button><button class="textbtn" style="margin-left:14px" data-note="正式版关闭采集并清空待上传队列，不能继续自动收集。">关闭采集</button></div><div class="sectionnote">Codex：已观察到事件（拟新增状态）<br>Claude Code：等待工具确认（拟新增状态）<br>按工具确认状态需要新增最小本机聚合，不能只由当前队列推断。</div></section></div>`,
settings:()=>heading('设置','把应用偏好放在这里，业务统计保持独立入口。','返回工作台','home')+`<section class="panel"><div class="panelhead"><h2>应用偏好</h2></div><div class="settingsrow"><div><h3>外观与语言</h3><p>保留浅色、深色、跟随系统和现有多语言能力。</p></div><button class="button" data-note="这是参考图的深色线框；正式版会沿用现有主题系统。">深色 · 简体中文</button></div><div class="settingsrow"><div><h3>应用更新</h3><p>安装版本、更新渠道和发行说明集中展示。</p></div><button class="button" data-note="正式版使用现有更新器，不改变签名和升级校验。">检查更新</button></div><details><summary>高级：启动、代理端口、日志与数据管理</summary><p>保留现有配置和备份功能；清理数据前明确影响范围。工具使用统计的采集开关位于组织与上报。</p><button class="button" data-nav="organization">打开组织与上报</button></details></section>`
};
let current='home',noticeTimer;function render(view){current=view;document.querySelector('#content').innerHTML=views[view]();document.querySelectorAll('.nav').forEach(button=>{if(button.dataset.nav===view)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});window.scrollTo(0,0)}
function note(text){const box=document.querySelector('.feedback');box.textContent=text;box.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>box.classList.remove('show'),6500)}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.nav){if(current==='assets'&&button.dataset.nav==='assets')note('正式版会重新获取授权 Stable 清单；此线框不会访问服务端。');else render(button.dataset.nav)}if(button.dataset.note)note(button.dataset.note);if(button.dataset.source){document.querySelectorAll('[data-source]').forEach(item=>item.setAttribute('aria-selected',String(item===button)));document.querySelector('#asset-body').innerHTML=button.dataset.source==='local'?'<section class="panel"><div class="empty"><h2>个人资产仍由你管理</h2><p>这里承接已有的本地 Skills、Prompts、Rules 和 Agents。团队配置不覆盖个人内容，现有文件和目录保持原位。</p><button class="button" data-note="正式版复用现有本地资产组件，并按目标工具筛选。">查看本地资产</button></div></section>':'<section class="panel"><div class="panelhead"><h2>当前授权的 Stable 资产</h2></div>'+assetRows()+'</section>'}});
document.addEventListener('change',event=>{if(event.target.matches('.filters select'))note('线框只演示筛选位置，图表仍为示例。正式版将调用已有用量 API 获取对应范围。')});
document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelector('.feedback').classList.remove('show')});render('home');
</script>
</body>
</html>
